name: publish

# Runs when you publish a GitHub release (e.g. tag v0.1.0). Uses PyPI trusted publishing: no token is stored.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: Check the tag matches the package version
        if: github.event_name == 'release'
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          proj = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          init = re.search(r'__version__ = "([^"]+)"', open("src/keo/__init__.py").read()).group(1)
          assert tag == proj == init, f"tag={tag} pyproject={proj} __init__={init} must all match"
          PY
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # lets PyPI verify this workflow's identity
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v5
      - run: uv publish
