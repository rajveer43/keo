name: Feature request
description: Suggest a dataset, algorithm, metric, figure or other improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it matter for the benchmark?
      description: For a dataset, say whether the e-means or o-means papers used it. For an algorithm, link the paper or code.
    validations:
      required: true
  - type: dropdown
    id: help
    attributes:
      label: Would you like to work on it?
      options:
        - "Yes, I can open a pull request"
        - "Maybe, with guidance"
        - "No, I am only suggesting it"
