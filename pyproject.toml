[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "keo"
version = "0.1.4"
description = "KEO: reproducible benchmark of K-means (Lloyd), E-means and O-means"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Rajveer Rathod" }]
keywords = [
  "clustering", "k-means", "kmeans", "e-means", "o-means", "benchmark",
  "machine-learning", "vector-search", "faiss", "pytorch", "embeddings",
  "reproducible-research", "unsupervised-learning", "glove",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  # Python >=3.9 keeps the tight lower bounds; Python 3.8 needs older releases (numpy>=1.26 is 3.9+).
  "numpy>=1.26; python_version>='3.9'",
  "numpy>=1.24; python_version<'3.9'",
  "scipy>=1.11; python_version>='3.9'",
  "scipy>=1.10; python_version<'3.9'",
  "scikit-learn>=1.4; python_version>='3.9'",
  "scikit-learn>=1.3; python_version<'3.9'",
  "torch>=2.2",
  "pandas>=2.1; python_version>='3.9'",
  "pandas>=2.0; python_version<'3.9'",
  "pyarrow>=14",
  "h5py>=3.10",
  "pyyaml>=6",
  "matplotlib>=3.8; python_version>='3.9'",
  "matplotlib>=3.7; python_version<'3.9'",
  "typer>=0.12",
  "faiss-cpu>=1.8; python_version>='3.9'",
  "faiss-cpu>=1.7.4; python_version<'3.9'",
  "typing_extensions>=4; python_version<'3.9'",
]

[project.scripts]
keo = "keo.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "configs", "assets/logo.svg", "README.md", "pyproject.toml", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/keo"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "keo/_configs"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "data: needs the downloaded dataset files (skipped if absent)",
  "slow: long-running test",
]

[project.urls]
Homepage = "https://github.com/rajveer43/keo"
Repository = "https://github.com/rajveer43/keo"
Issues = "https://github.com/rajveer43/keo/issues"
Changelog = "https://github.com/rajveer43/keo/blob/main/CHANGELOG.md"
Citation = "https://doi.org/10.5281/zenodo.24273473"
