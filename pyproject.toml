[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "keo"
version = "0.1.0"
description = "KEO: reproducible benchmark of K-means (Lloyd), E-means and O-means"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "torch>=2.2",
  "pandas>=2.1",
  "pyarrow>=14",
  "h5py>=3.10",
  "pyyaml>=6",
  "matplotlib>=3.8",
  "typer>=0.12",
  "faiss-cpu>=1.8",
]

[project.scripts]
keo = "keo.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "configs", "assets/logo.svg", "README.md", "pyproject.toml", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/keo"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "keo/_configs"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "data: needs the downloaded dataset files (skipped if absent)",
  "slow: long-running test",
]
